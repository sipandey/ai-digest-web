services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: aidigest-web
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_APP_URL=http://localhost:3100
      - PIPELINE_SERVICE_URL=http://pipeline:8000
    env_file:
      - .env
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    networks:
      - aidigest-network

  pipeline:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    container_name: aidigest-pipeline
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: ["python", "server.py"]
    env_file:
      - .env
    volumes:
      - ./pipeline:/app
    networks:
      - aidigest-network

networks:
  aidigest-network:
    driver: bridge
